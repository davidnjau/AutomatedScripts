name: Entries CI

on:
  push:
    branches: [main, entries]
    paths: ["entries/**", ".github/workflows/entries-ci.yml"]
  pull_request:
    branches: [main, entries]
    paths: ["entries/**", ".github/workflows/entries-ci.yml"]
  workflow_dispatch:

jobs:
  deploy-entries:
    if: github.ref == 'refs/heads/entries' && github.event_name == 'push'
    runs-on: [self-hosted, ardhisasa-bot]
    defaults:
      run:
        working-directory: entries
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Default clean=true runs `git clean -ffdx`, which deletes
          # ignored files too — including the .env this runner's checked-out
          # entries/ directory holds (env_file: .env in docker-compose.yml).
          # Without this, every deploy after the first wipes .env right
          # before docker-compose runs, breaking the container's env vars.
          clean: false

      - name: Rebuild and restart bot
        run: docker-compose up --build -d

      - name: Prune dangling images
        run: docker image prune -f
