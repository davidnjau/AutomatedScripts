name: CI

on:
  push:
    branches: [main, assign]
    paths: ["assign/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main, assign]
    paths: ["assign/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assign
    env:
      # Dummy values — ardhisasa_auth.py reads these via os.environ[...] at
      # import time to build its credential-profile dicts. Tests mock every
      # network call, so real credentials are never needed here.
      STAFF_SUPPORT_USER: ci-test
      STAFF_SUPPORT_PASS: ci-test
      STAFF_ICT_USER: ci-test
      STAFF_ICT_PASS: ci-test
      STAFF_VALUER_USER: ci-test
      STAFF_VALUER_PASS: ci-test
      PUBLIC_USER: ci-test
      PUBLIC_PASS: ci-test
      # common.py's ALLOWED_IDS must be non-empty — some tests (e.g.
      # test_auto_fetch's _auto_fetch_job tests) assert a Telegram send
      # happened, which only fires per-chat_id in ALLOWED_IDS.
      ALLOWED_TELEGRAM_IDS: "123456789"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

  deploy-assign:
    needs: test
    if: github.ref == 'refs/heads/assign' && github.event_name == 'push'
    runs-on: [self-hosted, ardhisasa-bot]
    defaults:
      run:
        working-directory: assign
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Default clean=true runs `git clean -ffdx`, which deletes
          # ignored files too — including the .env this runner's checked-out
          # assign/ directory holds (env_file: .env in docker-compose.yml).
          # Without this, every deploy after the first wipes .env right
          # before docker-compose runs, breaking the container's env vars.
          clean: false

      - name: Rebuild and restart bot
        run: docker-compose up --build -d

      - name: Prune dangling images
        run: docker image prune -f
